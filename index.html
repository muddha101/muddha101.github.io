<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BAE Yosup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: one white sheet in three columns (heading · text · image). The sheet repeats endlessly: scroll past the end and the beginning comes round again, in either direction. */
:root{
  --paper:#FFFFFF; --ink:#111111; --grey:#6E6E6E; --rule:#E4E4E4; --soft:#F4F4F4; --warn:#B4492E;
  --f:"Hanken Grotesk","IBM Plex Sans KR","Helvetica Neue",Arial,sans-serif;
  --t-s:11px; --t:13px; --t-m:15px;
  --c1:13rem; --gap:clamp(1.5rem,3.5vw,3.5rem);
  color-scheme:light;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:var(--t);line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--grey)}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
h1,h2,h3,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3{font-size:var(--t);font-weight:500;text-wrap:balance}
em,i{font-style:italic}
.pre{white-space:pre-line}
.muted{color:var(--grey)}

.sheet{max-width:90rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:3.5rem 0}
.row{display:grid;grid-template-columns:var(--c1) minmax(0,25rem) minmax(0,1fr);gap:var(--gap);padding-bottom:4.5rem}
.row>*{min-width:0}
.row .c1{display:grid;gap:.15rem;align-content:start}
.row .c2{display:grid;gap:.85rem;align-content:start}
.row .c3{display:grid;gap:.5rem;align-content:start}
.label{padding-bottom:1.6rem}
@media (max-width:980px){.row{grid-template-columns:var(--c1) minmax(0,1fr)}.row .c3{grid-column:2}}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:1rem;padding-bottom:3.5rem}.row .c3{grid-column:auto}}

.hero-img{width:100%;max-width:34rem;aspect-ratio:1;object-fit:cover;display:block;border:1px solid var(--rule)}
.work-img{width:100%;max-width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.5rem}
.thumbs img{width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.bw img{filter:grayscale(1);transition:filter .6s ease}
.bw img:hover{filter:none}
figcaption{font-size:var(--t-s);color:var(--grey)}
.slider{display:block;width:100%;padding:0;border:0;background:none;overflow:hidden;cursor:pointer}
.track{display:flex;transition:transform .7s cubic-bezier(.65,0,.2,1)}
.track img{flex:0 0 100%;width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.bw .slider:hover img{filter:none}
.count{font-variant-numeric:tabular-nums}
.lang{display:flex;gap:.6rem;font-size:var(--t-s);margin-bottom:1.4rem}
.lang a{text-decoration:none;color:var(--grey)}
.lang a[aria-current="true"]{color:var(--ink);text-decoration:underline}
.portrait{width:100%;max-width:10rem;aspect-ratio:4/5;object-fit:cover;display:block}
.portrait-wrap{position:relative;margin:.8rem 0 .6rem;max-width:10rem}
.portrait-wrap .del{position:absolute;top:.3rem;right:.3rem}
.photo-box.portrait-box{aspect-ratio:4/5;max-width:10rem}
.more{font-size:var(--t-s);margin-top:.15rem}
.back{font-size:var(--t-s);color:var(--grey)}
.page-title{font-size:var(--t-m);font-weight:500}
.page-lead{font-size:var(--t-m);line-height:1.5}
.contact-lines{display:grid;gap:.15rem;margin-top:.6rem}

.phase{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:1rem;position:relative}
.phase .y{color:var(--grey);font-variant-numeric:tabular-nums}
.phase div{display:grid;gap:.25rem}
.phase .sub{font-style:italic}

.list{display:grid}
.list li{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:1rem;padding:.12rem 0;position:relative}
.list li .y{color:var(--grey);font-variant-numeric:tabular-nums}
.list li .note{color:var(--grey)}
.list.wide li{grid-template-columns:5.5rem minmax(0,1fr) minmax(0,1fr)}
@media (max-width:640px){.list.wide li{grid-template-columns:4.5rem minmax(0,1fr)}.list.wide li .note{grid-column:2}}

.loopmark{text-align:left;color:var(--grey);font-size:var(--t-s);padding-bottom:3.5rem;letter-spacing:.2em}
.copy{display:block}
.copy[aria-hidden="true"] *{pointer-events:auto}

.ghost{font:inherit;font-size:var(--t-s);background:none;border:0;padding:0;color:var(--grey);text-decoration:underline;cursor:pointer;justify-self:start}
.ghost:hover{color:var(--ink)}
.loading{padding:3.5rem 0;color:var(--grey)}

/* editing */
.bar{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:flex;gap:.35rem;align-items:center;background:var(--paper);border:1px solid var(--ink);padding:.35rem}
.bar .msg{font-size:var(--t-s);color:var(--grey);padding:0 .5rem;max-width:17rem}
.bar .msg.err{color:var(--warn)}
.btn{font:inherit;font-size:var(--t-s);font-weight:500;padding:.4rem .75rem;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
body.editing [data-path]{outline:1px dashed #BDBDBD;outline-offset:2px;cursor:text;min-height:1em;display:block}
body.editing [data-path]:focus{outline:1px solid var(--ink);background:var(--soft)}
body.editing [data-path]:empty::before{content:attr(data-ph);color:#AAAAAA}
.ed{display:none}
body.editing .ed{display:inline-flex}
.add{font:inherit;font-size:var(--t-s);color:var(--grey);background:none;border:1px dashed #BDBDBD;padding:.3rem .65rem;cursor:pointer;justify-self:start;align-items:center;margin-top:.4rem}
.add:hover{color:var(--ink);border-color:var(--ink)}
.del{font:inherit;font-size:12px;line-height:1;width:1.3rem;height:1.3rem;align-items:center;justify-content:center;background:var(--paper);color:var(--grey);border:1px solid var(--rule);cursor:pointer}
.del:hover{color:var(--warn);border-color:var(--warn)}
.phase>.del,.list li>.del{position:absolute;top:0;right:-1.8rem}
.row>.del{justify-self:start}
.thumbs figure,.c3 figure{position:relative}
.c3 figure .del{position:absolute;top:.3rem;right:.3rem}
.field{display:none;gap:.2rem;font-size:var(--t-s);color:var(--grey)}
body.editing .field{display:grid}
input[type=file]{display:none}
.photo-slot{width:100%}
.photo-box{display:flex!important;width:100%;aspect-ratio:3/2;justify-content:center;align-items:center;margin-top:0;font-size:var(--t);background:var(--soft)}
.btn.add-work{border-style:dashed}
@media (max-width:640px){.phase>.del,.list li>.del{right:0}}
</style>

<div id="root"><div class="sheet"><p class="loading">BAE Yosup</p></div></div>

<script>
(function(){
  'use strict';
  var root=document.getElementById('root');
  var saved=null, state=null, editing=false, canEdit=false, artifactApi=null;
  var pendingImages={}, blobUrls={};
  var dirty=false, busy=false, message='', messageErr=false;
  // Address: #en / #ko for the main page, #tuida / #tuida-ko / #muddha / #muddha-ko for the two group pages.
  var PAGES=['tuida','muddha'];
  function parseHash(){var x=location.hash.slice(1),m=/^(tuida|muddha)(-ko)?$/.exec(x);
    if(m)return {page:m[1],lang:m[2]?'ko':'en'};return {page:'',lang:x==='ko'?'ko':'en'};}
  function hashFor(l,pg){return '#'+(pg?pg+(l==='ko'?'-ko':''):l);}
  var view=parseHash(), lang=view.lang;
  function other(){return lang==='ko'?'en':'ko';}
  var UI={
    en:{more:'Read more →',back:'← BAE Yosup',section:'Add section',path:'From Tuida to Muddha',works:'Selected Works',chron:'Chronology',awards:'Awards',career:'Positions & Education',teaching:'Teaching',contact:'Contact: ',copy:'copy',copied:'copied',select:'select the address to copy',video:'Video',next:' — click the photo for the next one',title:'BAE Yosup',fail:'The page content could not be loaded. Reload to try again.'},
    ko:{more:'자세히 보기 →',back:'← 배요섭',section:'항목 추가',path:'뛰다에서 묻다로',works:'대표 작업',chron:'작품 연보',awards:'수상',career:'경력 · 학력',teaching:'교육 · 워크숍',contact:'연락: ',copy:'복사',copied:'복사됨',select:'주소를 선택해 복사하세요',video:'영상',next:' — 사진을 누르면 다음 사진으로 넘어갑니다',title:'배요섭',fail:'페이지 내용을 불러오지 못했습니다. 새로고침해 주세요.'}};
  function u(k){return UI[lang][k];}
  function loc(){return {en:'',ko:''};}
  // A text field is either a plain string (shared by both languages) or {en, ko}.
  function txt(v,l){if(v&&typeof v==='object'){var a=v[l||lang];return a||(l?'':v[other()])||'';}return v||'';}

  function clone(o){return JSON.parse(JSON.stringify(o));}
  function get(path){return path.split('.').reduce(function(o,k){return o==null?o:o[k];},state);}
  function set(path,val){var ks=path.split('.'),o=state;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;}
  function src(p){return blobUrls[p]||p;}

  function h(tag,attrs){
    var e=document.createElement(tag);
    if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
      if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
    for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
      if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x);});
      else e.appendChild(typeof c==='string'?document.createTextNode(c):c);}
    return e;
  }
  // Text bound to one field of the data; editable in edit mode.
  function T(tag,path,cls,ph,forceLang){
    var L=forceLang||lang, v=get(path);
    var e=h(tag,{class:cls,'data-path':editing?path+(forceLang?':'+forceLang:''):null,'data-ph':editing?(ph||'Add text'):null});
    e.textContent=(v&&typeof v==='object')?(editing?(v[L]||''):txt(v,forceLang)):(v||'');
    if(editing){
      e.contentEditable='plaintext-only';
      if(e.contentEditable!=='plaintext-only'){e.contentEditable='true';
        e.addEventListener('paste',function(ev){ev.preventDefault();document.execCommand('insertText',false,(ev.clipboardData||window.clipboardData).getData('text'));});}
      e.spellcheck=false;
      e.addEventListener('input',function(){var val=e.innerText.replace(/\n$/,''),cur=get(path);
        if(cur&&typeof cur==='object')cur[L]=val;else set(path,val);markDirty();});
    }
    return e;
  }
  function del(onclick,label){return h('button',{class:'del ed',type:'button','aria-label':label||'Remove',title:label||'Remove',onclick:onclick},'×');}
  function add(label,onclick){return h('button',{class:'add ed',type:'button',onclick:onclick},'+ '+label);}
  function removeAt(arrPath,i){return function(){get(arrPath).splice(i,1);markDirty();render();};}
  function pushTo(arrPath,item){return function(){get(arrPath).push(item);markDirty();render();};}
  function unshiftTo(arrPath,item){return function(){get(arrPath).unshift(item);markDirty();render();};}
  function markDirty(){if(!dirty){dirty=true;message='Unsaved changes';messageErr=false;renderBar();}}

  function photoButton(label,onPath,box,boxCls){
    var id='file-'+Math.random().toString(36).slice(2);
    var input=h('input',{type:'file',accept:'image/*',id:id});
    input.addEventListener('change',function(){var f=input.files[0];if(!f)return;
      shrink(f).then(function(blob){var p='img/up-'+Date.now()+'.jpg';pendingImages[p]=blob;blobUrls[p]=URL.createObjectURL(blob);onPath(p);markDirty();render();})
      .catch(function(){message='Could not read that image. Try a JPG or PNG.';messageErr=true;renderBar();});});
    return h('span',{class:'ed'+(box?' photo-slot':'')},input,h('label',{for:id,class:'add'+(box?' photo-box '+(boxCls||''):''),style:'display:inline-flex'},'+ '+label));
  }
  function shrink(file){
    return new Promise(function(res,rej){var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height));var c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
        c.toBlob(function(b){b?res(b):rej();},'image/jpeg',.85);};
      img.onerror=function(){URL.revokeObjectURL(url);rej();};img.src=url;});
  }

  function langNav(){
    return h('nav',{class:'lang','aria-label':'Language'},
      h('a',{href:hashFor('en',view.page),'aria-current':lang==='en'?'true':null,lang:'en'},'EN'),
      h('a',{href:hashFor('ko',view.page),'aria-current':lang==='ko'?'true':null,lang:'ko'},'한국어'));
  }

  // ---------- the sheet ----------
  function bio(){
    var p=state.profile, c=state.contact;
    var copyBtn=h('button',{class:'ghost',type:'button'},u('copy'));
    copyBtn.addEventListener('click',function(){
      try{navigator.clipboard.writeText(c.email).then(function(){copyBtn.textContent=u('copied');setTimeout(function(){copyBtn.textContent=u('copy');},1500);},function(){copyBtn.textContent=u('select');});}
      catch(e){copyBtn.textContent=u('select');}});
    var portrait=p.portrait?h('div',{class:'portrait-wrap bw'},h('img',{class:'portrait',src:src(p.portrait),alt:(lang==='ko'?p.nameKo:p.nameEn)}),del(function(){p.portrait='';markDirty();render();},'Remove portrait')):null;
    return h('div',{class:'row'},
      h('div',{class:'c1'},
        langNav(),
        T('h1',lang==='ko'?'profile.nameKo':'profile.nameEn'),T('p',lang==='ko'?'profile.nameEn':'profile.nameKo','muted'),
        portrait,
        editing?photoButton(p.portrait?'Replace portrait':'Add portrait',function(x){p.portrait=x;},!p.portrait,'portrait-box'):null,
        T('p','profile.roles','muted'),T('p','profile.location','muted')),
      h('div',{class:'c2'},
        T('p','profile.intro','pre'),
        T('div','statement','pre'),
        h('div',{class:'contact-lines'},
          h('p',null,u('contact'),editing?T('span','contact.email'):h('span',null,c.email,' '),editing?null:copyBtn),
          T('p','contact.address','muted'),
          editing?h('div',{class:'field'},c.links.map(function(_,i){return h('div',null,T('span','contact.links.'+i+'.label',null,'Link name'),T('span','contact.links.'+i+'.url',null,'https://…'));})):
            c.links.map(function(l){return h('p',null,h('a',{href:l.url,target:'_blank',rel:'noopener'},txt(l.label)));}))),
      h('div',{class:'c3'},
        h('figure',{class:'bw'},p.heroImage?h('img',{class:'hero-img',src:src(p.heroImage),alt:txt(p.heroCaption)||'Performance photograph'}):null),
        T('figcaption','profile.heroCaption',null,'Photo caption'),
        editing?photoButton('Replace main photo',function(x){state.profile.heroImage=x;}):null));
  }

  function path(){
    return h('div',{class:'row'},
      h('div',{class:'c1'},h('h2',null,u('path'))),
      h('div',{class:'c2'},state.phases.map(function(_,i){var b='phases.'+i+'.';
          return h('div',{class:'phase'},T('span',b+'years','y','Years'),h('div',null,T('h3',b+'name',null,'Name'),T('p',b+'subtitle','sub','Subtitle'),T('p',b+'text','muted','Text'),state.phases[i].page&&state.pages&&state.pages[state.phases[i].page]?h('p',{class:'more'},h('a',{href:hashFor(lang,state.phases[i].page)},u('more'))):null),del(removeAt('phases',i),'Remove this period'));}),
        add('Add period',function(){state.phases.push({years:'',name:loc(),subtitle:loc(),text:loc()});markDirty();render();})),
      h('div',{class:'c3'}));
  }

  function works(){
    return [
      h('div',{class:'row label'},h('div',{class:'c1'},h('h2',null,u('works'))),h('div',{class:'c2'},add('Add new work here',addWork)),h('div',{class:'c3'}))
    ].concat(state.featured.map(function(w,i){var b='featured.'+i+'.';
      var first=w.images[0], rest=w.images.slice(1);
      function fig(im,j,cls){return h('figure',null,h('img',{class:cls,src:src(im),alt:(txt(w.title)||'Work')+' — photo '+(j+1),loading:'lazy'}),del(function(){w.images.splice(j,1);markDirty();render();},'Remove photo'));}
      return h('div',{class:'row'},
        h('div',{class:'c1'},T('h3',b+'title',null,lang==='ko'?'제목':'Title'),T('p',b+'year',null,'Year'),T('p',b+'title','muted',lang==='ko'?'English title':'한국어 제목',other()),T('p',b+'venue','muted','Venue'),del(removeAt('featured',i),'Remove this work')),
        h('div',{class:'c2'},
          T('p',b+'text','pre','Description'),
          T('p',b+'role','muted','Role'),
          w.link&&!editing?h('p',null,h('a',{href:w.link,target:'_blank',rel:'noopener'},u('video'))):null,
          h('div',{class:'field'},'Video link',T('span',b+'link',null,'https://…'))),
        h('div',{class:'c3 bw'},
          editing?(first?fig(first,0,'work-img'):null):slider(w),
          editing&&rest.length?h('div',{class:'thumbs'},rest.map(function(im,k){return fig(im,k+1);})):null,
          editing?photoButton(w.images.length?'Add another photo':'Add photo',function(x){w.images.push(x);},!w.images.length):null));
    }),[h('div',{class:'row'},h('div',{class:'c1'}),h('div',{class:'c2'},add('Add new work at the end',function(){addWork(true);})),h('div',{class:'c3'}))]);
  }

  // One photo at a time; clicking it slides to the next and wraps round after the last.
  function slider(w){
    var imgs=w.images, n=imgs.length;
    if(!n)return null;
    var alt=function(j){return (txt(w.title)||'Work')+' — photo '+(j+1)+' of '+n;};
    if(n===1)return h('figure',null,h('img',{class:'work-img',src:src(imgs[0]),alt:alt(0),loading:'lazy'}));
    var i=0;
    var track=h('div',{class:'track'},imgs.map(function(im,j){return h('img',{src:src(im),alt:alt(j)});}));
    var count=h('span',{class:'count'},'1 / '+n);
    var box=h('button',{class:'slider',type:'button','aria-label':'Show next photo of '+(txt(w.title)||'this work')},track);
    box.addEventListener('click',function(){
      i=(i+1)%n;track.style.transform='translateX('+(-100*i)+'%)';count.textContent=(i+1)+' / '+n;});
    return h('figure',null,box,h('figcaption',null,count,u('next')));
  }

  // Photos for any item with an images list: a click-to-slide viewer, or thumbnails with add/remove in edit mode.
  function gallery(o,title){
    var first=o.images[0], rest=o.images.slice(1);
    function fig(im,j,cls){return h('figure',null,h('img',{class:cls,src:src(im),alt:(title||'Photo')+' — '+(j+1),loading:'lazy'}),del(function(){o.images.splice(j,1);markDirty();render();},'Remove photo'));}
    if(!editing)return slider({images:o.images,title:title});
    return [first?fig(first,0,'work-img'):null,
      rest.length?h('div',{class:'thumbs'},rest.map(function(im,k){return fig(im,k+1);})):null,
      photoButton(o.images.length?'Add another photo':'Add photo',function(x){o.images.push(x);},!o.images.length)];
  }

  function groupPage(key){
    var pg=state.pages[key], b='pages.'+key+'.';
    var main=hashFor(lang,'');
    var rows=[
      h('div',{class:'row'},
        h('div',{class:'c1'},langNav(),h('p',null,h('a',{class:'back',href:main},u('back')))),
        h('div',{class:'c2'},T('h1',b+'title','page-title','Title'),T('p',b+'years','muted','Years'),T('div',b+'lead','page-lead pre','Introduction')),
        h('div',{class:'c3'}))
    ].concat(pg.sections.map(function(s,i){var sb=b+'sections.'+i+'.';
      return h('div',{class:'row'},
        h('div',{class:'c1'},T('p',sb+'years','muted','Years'),T('h2',sb+'heading',null,'Heading'),del(function(){pg.sections.splice(i,1);markDirty();render();},'Remove this section')),
        h('div',{class:'c2'},T('p',sb+'text','pre','Text')),
        h('div',{class:'c3 bw'},gallery(s,txt(s.heading))));
    }));
    rows.push(h('div',{class:'row'},h('div',{class:'c1'},h('p',null,h('a',{class:'back',href:main},u('back')))),
      h('div',{class:'c2'},add(u('section'),function(){pg.sections.push({years:'',heading:loc(),text:loc(),images:[]});markDirty();render();})),h('div',{class:'c3'})));
    return rows;
  }

  function listRow(title,arr,cols,blank,wide){
    return h('div',{class:'row'},
      h('div',{class:'c1'},h('h2',null,title)),
      h('div',{class:'c2',style:wide?'grid-column:2 / -1':null},
        h('ol',{class:'list'+(wide?' wide':'')},state[arr].map(function(_,i){var b=arr+'.'+i+'.';
          return h('li',null,cols.map(function(c){return T('span',b+c[0],c[1],c[2]);}),del(removeAt(arr,i)));})),
        add('Add at top',function(){state[arr].unshift(blank());markDirty();render();})),
      wide?null:h('div',{class:'c3'}));
  }

  function sheet(){
    return [bio(),path()].concat(works(),[
      listRow(u('chron'),'works',[['year','y','Year'],['title',null,'Title'],['note','note','Role · producer']],function(){return {year:'',title:loc(),note:loc()};},true),
      listRow(u('awards'),'awards',[['year','y','Year'],['text',null,'Award']],function(){return {year:'',text:loc()};}),
      listRow(u('career'),'career',[['year','y','Year'],['text',null,'Text']],function(){return {year:'',text:loc()};}),
      listRow(u('teaching'),'teaching',[['year','y','Year'],['text',null,'Text']],function(){return {year:'',text:loc()};})
    ]);
  }

  // ---------- endless loop ----------
  // Three identical copies; the reader stays in the middle one. Leaving it by half a copy in either
  // direction shifts the scroll by exactly one copy, so the page never ends.
  var loopH=0, ro=null;
  function measure(){var c=root.querySelectorAll('.copy');if(c.length===3)loopH=c[1].offsetTop-c[0].offsetTop;}
  function onScroll(){
    if(editing||!loopH)return;
    var y=window.scrollY;
    if(y<loopH*0.5)window.scrollTo(0,y+loopH);
    else if(y>loopH*1.5)window.scrollTo(0,y-loopH);
  }
  window.addEventListener('scroll',onScroll,{passive:true});

  function render(){
    document.documentElement.lang=lang;
    var gp=view.page&&state.pages&&state.pages[view.page]?view.page:'';
    document.title=gp?txt(state.pages[gp].title)+' — '+u('title'):u('title');
    var rel=loopH?((window.scrollY%loopH)+loopH)%loopH:window.scrollY;
    if(ro){ro.disconnect();ro=null;}
    root.innerHTML='';
    if(gp){
      loopH=0;var y=window.scrollY;
      root.appendChild(h('div',{class:'sheet'},groupPage(gp)));
      window.scrollTo(0,y);
    }else if(editing){
      root.appendChild(h('div',{class:'sheet'},sheet()));
      window.scrollTo(0,rel);loopH=0;
    }else{
      for(var k=0;k<3;k++){
        var copy=h('div',{class:'copy'},h('div',{class:'sheet'},sheet(),h('p',{class:'loopmark','aria-hidden':'true'},'>>>')));
        if(k!==1){copy.setAttribute('aria-hidden','true');}
        root.appendChild(copy);
      }
      measure();window.scrollTo(0,loopH+rel);
      if('ResizeObserver' in window){
        var first=root.querySelector('.copy');
        ro=new ResizeObserver(function(){var before=loopH,y=window.scrollY;measure();
          if(before&&loopH&&before!==loopH){var r=(y-before);window.scrollTo(0,loopH+Math.max(0,r));}});
        ro.observe(first);
      }
    }
    renderBar();
  }

  // ---------- editing ----------
  var bar=null;
  function renderBar(){
    if(!canEdit){if(bar){bar.remove();bar=null;}return;}
    if(!bar){bar=h('div',{class:'bar',role:'toolbar','aria-label':'Page editing'});document.body.appendChild(bar);}
    bar.innerHTML='';
    if(message)bar.appendChild(h('span',{class:'msg'+(messageErr?' err':''),role:'status',text:message}));
    bar.appendChild(h('button',{class:'btn add-work',type:'button',onclick:function(){addWork();},disabled:busy},'+ New work'));
    if(!editing)bar.appendChild(h('button',{class:'btn',type:'button',onclick:startEdit},'Edit page'));
    else{
      bar.appendChild(h('button',{class:'btn',type:'button',onclick:cancelEdit,disabled:busy},'Discard'));
      bar.appendChild(h('button',{class:'btn primary',type:'button',onclick:save,disabled:busy||!dirty},busy?'Saving…':'Save'));
    }
  }
  // Adds an empty work (top by default), opens edit mode and puts the cursor in its title.
  function addWork(atEnd){
    var blank={title:loc(),year:'',venue:loc(),role:loc(),text:loc(),images:[],link:''};
    if(view.page){view={page:'',lang:lang};loopH=0;location.hash=hashFor(lang,'');}
    if(!editing){editing=true;document.body.classList.add('editing');}
    if(atEnd)state.featured.push(blank);else state.featured.unshift(blank);
    message='New work added. Fill in the title, text and photo.';messageErr=false;dirty=true;
    render();
    var el=root.querySelector('[data-path="featured.'+(atEnd?state.featured.length-1:0)+'.title"]');
    if(el){el.scrollIntoView({block:'center'});el.focus();}
  }
  function startEdit(){editing=true;message='Click any text to change it';messageErr=false;document.body.classList.add('editing');render();}
  function stopEdit(){editing=false;document.body.classList.remove('editing');}
  function cancelEdit(){state=clone(saved);pendingImages={};dirty=false;message='';stopEdit();render();}
  function save(){
    if(!artifactApi||busy)return;
    busy=true;message='';renderBar();
    var files={'data/site.json':JSON.stringify(state,null,2)};
    Object.keys(pendingImages).forEach(function(p){files[p]=pendingImages[p];});
    artifactApi.publish(files).then(function(){
      saved=clone(state);pendingImages={};dirty=false;busy=false;stopEdit();message='Saved';messageErr=false;render();
      setTimeout(function(){if(message==='Saved'){message='';renderBar();}},2500);
    },function(err){
      busy=false;var c=err&&err.code;messageErr=true;
      if(c==='not_writer'||c==='not_granted'){message='This view is read-only.';canEdit=false;stopEdit();render();return;}
      if(c==='capability_disabled')message='Saving isn’t available in this view. Your edits are still on the page.';
      else if(c==='conflict')message='A newer version was saved elsewhere. The page will reload to it.';
      else if(c==='rate_limited')message='Too many saves in a row. Wait a moment, then save again.';
      else message='Couldn’t save ('+(c||'unknown error')+'). Try again.';
      renderBar();
    });
  }

  window.addEventListener('hashchange',function(){
    var nv=parseHash();
    if(!state||(nv.page===view.page&&nv.lang===lang))return;
    var pageChanged=nv.page!==view.page;
    view=nv;lang=nv.lang;
    if(pageChanged){loopH=0;window.scrollTo(0,0);}
    render();
    if(!view.page&&!editing)window.scrollTo(0,loopH);
  });

  fetch('data/site.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){saved=d;state=clone(d);render();})
    .catch(function(){root.innerHTML='';root.appendChild(h('div',{class:'sheet'},h('p',{class:'loading'},u('fail'))));});

  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
      artifactApi=r[0];var user=r[1];
      if(!artifactApi||!user)return;
      return user.canEdit().then(function(ok){canEdit=!!ok;if(state)renderBar();});
    }).catch(function(){});
  }
})();
</script>

</body></html>
